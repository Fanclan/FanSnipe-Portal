name: Portal checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: portal-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal:
    name: Portal quality and browser tests
    runs-on: ubuntu-24.04
    container:
      # Match the browser bundled with the Playwright version in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:766137e2d9caad4744187e53cdc89320ba6f2eb57cff097374020944b44dd0a9
      options: --init --shm-size=512m
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned companion for real browser integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fanclan/FanSnipe-Companion
          ref: 3c832886eae75c0a3790dcf2743749e9e38d486e
          path: .integration/companion
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for media integration
        run: |
          curl -fLSs --retry 3 --max-time 120 https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-2/jellyfin-ffmpeg_8.1.3-2_portable_linux64-gpl.tar.xz -o "$RUNNER_TEMP/media.tar.xz"
          printf '%s  %s\n' 1df84d04c4322902dba81c290508cdf3d89524d210b9fe03154bea6c4e3bfbb6 "$RUNNER_TEMP/media.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/fansnipe-media"
          python3 -m tarfile --filter data -e "$RUNNER_TEMP/media.tar.xz" "$RUNNER_TEMP/fansnipe-media"
          echo "$RUNNER_TEMP/fansnipe-media" >> "$GITHUB_PATH"
      - run: npm ci && npm run build
        working-directory: .integration/companion
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: FANSNIPE_ENGINE_DIST="$GITHUB_WORKSPACE/.integration/companion/dist/app.js" npm run test:e2e
        env:
          FANSNIPE_REQUIRE_STUDIO_JOURNEY: '1'
